# Pre-merge checks.
#
# deploy.yml only fires once main has already moved, so before this workflow
# nothing verified a pull request: a red test, a type error in the SPA, or a
# broken Android build config could all reach main unnoticed.
#
# Every job runs on every pull request regardless of which paths changed. A
# paths filter would report "skipped" rather than "success", which blocks a
# required status check instead of satisfying it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the runtime image in Dockerfile.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Each test module puts the repo root and ui/ on sys.path itself, so no
        # PYTHONPATH is needed here.
        run: python -m pytest tests/ -q

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the build stage in Dockerfile.
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        # ci, not install: honours the lockfile exactly, as the image build does.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Runs tsc -b before vite build, so this is the type check too. The
        # image build does the same, meaning a type error here would otherwise
        # only surface as a failed deploy after merge.
        run: npm run build

  image:
    name: Docker image (${{ matrix.arch }})
    # Every architecture deploy.yml publishes, on the same native runners. The
    # publish refuses to move :latest unless all of them built, so a Dockerfile
    # or dependency change that breaks one would otherwise surface only as a
    # stuck deploy after merge. arm64 is the one that matters most: nobody
    # here runs it day to day, which is how it went missing in issue #45.
    strategy:
      # Each architecture's result is worth having even when the other fails.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pick-a-recipe:ci
          # Read-only: deploy.yml fills these scopes from main, and layers
          # written from a pull request would be visible to that pull request
          # alone anyway.
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Check the native dependencies
        # A successful build does not prove these work: a wheel can install
        # and still fail to load, and ffmpeg and deno are downloaded per
        # architecture. These are what differ between amd64 and arm64.
        run: |
          docker run --rm pick-a-recipe:ci sh -ec '
            ffmpeg -version | head -1
            deno --version | head -1
            python -c "import faster_whisper, ctranslate2, av, curl_cffi, argon2, cryptography; print(\"native imports ok\")"
          '

      - name: Start the app
        # Runs the image's own CMD, so this also covers the yt-dlp upgrade it
        # does on startup.
        run: |
          docker run -d --name app -p 5006:5006 pick-a-recipe:ci
          for _ in $(seq 90); do
            if curl -fsS http://localhost:5006/healthz; then
              exit 0
            fi
            if [[ $(docker inspect -f '{{.State.Running}}' app) != true ]]; then
              echo "::error::The container exited during startup"
              break
            fi
            sleep 2
          done
          docker logs app
          exit 1

  mobile:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches jvmTarget in android/app/build.gradle.kts.
          java-version: '17'

      - name: Set up Flutter
        # Third-party action, pinned to a commit rather than a movable tag.
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        # Neither analyze nor test touches Gradle, which is exactly how a
        # broken Android build config survived from the scaffold commit until
        # someone tried to build an APK by hand.
        run: flutter build apk --debug --dart-define=FLAVOR=dev
