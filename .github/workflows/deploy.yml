# Build & Deploy — pick-a-recipe
#
# On every push to main:
#   1. Build the Docker image for linux/amd64 and linux/arm64, each on a
#      native runner, and push both to Docker Hub by digest.
#   2. Join the two into one multi-arch image, check that both platforms are
#      really in it, and only then tag it pickeld/pick-a-recipe:latest
#      (+ :<commit sha> for rollback).
#   3. Call Portainer on srv2 via scripts/portainer-deploy.sh --pull,
#      which updates the "pick-a-recipe" stack (compose file + env)
#      and pulls the freshly pushed image.
#
# Only the last job is self-hosted, and only because Portainer lives on the
# LAN and GitHub-hosted runners cannot reach it. The build talks to Docker Hub
# and nothing else, so it runs on GitHub-hosted runners: this repository is
# public, which makes those free — the arm64 ones included — and it keeps
# multi-gigabyte build caches and toolchains off hardware that is also serving
# other things. A self-hosted runner that filled its disk used to take the
# whole deploy down with it.
#
# The deploy job needs only curl, jq and git — no Docker. Register a runner on
# any LAN machine:
#   repo → Settings → Actions → Runners → New self-hosted runner
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  Docker Hub username ("pickeld")
#   DOCKERHUB_TOKEN     Docker Hub access token (hub.docker.com → Account Settings → Security)
#   PORTAINER_URL       e.g. https://192.168.127.251:7441
#   PORTAINER_API_KEY   Portainer access token (Portainer → My account → Access tokens)
#   STACK_ENV_LOCAL     Contents of portainer/stack.env.local (FLASK_SECRET_KEY,
#                       Google SSO keys, ...). Written to portainer/stack.env.local
#                       before deploying so the real app secrets reach the stack —
#                       without it the deploy would overwrite them with placeholders.
#
# Optional repository secrets:
#   JWT_SECRET_KEY      Signing key for Android app tokens, appended to the stack
#                       env above. Unset leaves /api/mobile/* returning 503.
#                       Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: pickeld/pick-a-recipe

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    # This used to build amd64 alone, because emulating arm64 under QEMU took
    # 15-30 minutes. Every push to main then replaced :latest with an
    # amd64-only image, and anyone pulling on a Raspberry Pi or another arm64
    # host got "no matching manifest for linux/arm64/v8" (issue #45). A native
    # arm64 runner builds as fast as the amd64 one, so both run side by side.
    #
    # Keep this list in step with REQUIRED_PLATFORMS in the publish job and
    # with the image job in ci.yml.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed by digest, with no tag: any tag set here would name a
      # single-architecture image, which is exactly what must not reach users.
      # The publish job gives the joined image its tags.
      #
      # A hosted runner starts empty every time, so the layer cache has to live
      # somewhere: type=gha keeps it in GitHub's Actions cache rather than in a
      # builder volume on a machine we own. Each architecture has its own
      # scope, or the two builds would keep evicting each other's layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Hand the digest to the publish job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join the per-architecture images
        working-directory: ${{ runner.temp }}/digests
        run: |
          # One empty file per digest, named after it — see the build job.
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "${sources[@]}"

      # The guard against issue #45 coming back. It runs before :latest moves,
      # so an image that is missing an architecture only ever exists under its
      # commit tag, which nobody pulls by accident. Fixing this means building
      # the missing platform, not dropping it from the list.
      - name: Check every platform is published
        env:
          REQUIRED_PLATFORMS: linux/amd64 linux/arm64
        run: |
          set -euo pipefail
          # Attestation manifests are listed as unknown/unknown; skip them.
          published=$(docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
            | sort -u)
          printf 'Published platforms:\n%s\n' "$published"

          missing=()
          for platform in $REQUIRED_PLATFORMS; do
            grep -qxF "$platform" <<<"$published" || missing+=("$platform")
          done
          if ((${#missing[@]})); then
            echo "::error::$IMAGE:$GITHUB_SHA has no ${missing[*]} image; leaving :latest where it was"
            exit 1
          fi

      - name: Move latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

  deploy:
    name: Deploy to srv2 via Portainer
    # Self-hosted purely for LAN reach: scripts/portainer-deploy.sh is curl and
    # jq against the Portainer API, so this needs no Docker and no toolchain.
    runs-on: [self-hosted]
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write stack env from secret
        env:
          STACK_ENV_LOCAL: ${{ secrets.STACK_ENV_LOCAL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [[ -z "$STACK_ENV_LOCAL" ]]; then
            echo "::error::STACK_ENV_LOCAL secret is not set — see header of .github/workflows/deploy.yml"
            exit 1
          fi
          printf '%s\n' "$STACK_ENV_LOCAL" > portainer/stack.env.local
          # Kept as its own secret so rotating it does not mean re-pasting the
          # whole env blob. Appended last, so it wins over any JWT_SECRET_KEY in
          # STACK_ENV_LOCAL; unset simply leaves mobile auth disabled.
          if [[ -n "$JWT_SECRET_KEY" ]]; then
            printf 'JWT_SECRET_KEY=%s\n' "$JWT_SECRET_KEY" >> portainer/stack.env.local
            echo "Mobile auth: JWT_SECRET_KEY supplied"
          else
            echo "Mobile auth: JWT_SECRET_KEY not set — /api/mobile/* will return 503"
          fi

      - name: Update srv2 stack (pull new image)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: ./scripts/portainer-deploy.sh --pull
