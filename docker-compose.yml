version: "3.8"

services:
  pick-a-recipe:
    image: pickeld/pick-a-recipe:latest
    # Uncomment to build from source instead:
    # build: .
    container_name: pick-a-recipe
    restart: unless-stopped
    ports:
      # Plain HTTP. Open http://<host>:5006. There is no default username or
      # password; the first visit creates the account. A reverse proxy must
      # connect here with HTTP. Sending plain HTTP to the proxy's HTTPS port
      # produces "Client sent an HTTP request to an HTTPS server."
      - "5006:5006"
    environment:
      - HOST=0.0.0.0
      - PORT=5006
      - FLASK_SECRET_KEY=change-me-to-a-random-secret-key
      # info by default. Set debug, restart, repeat the problem, and paste
      # `docker logs pick-a-recipe --since 30m` into a bug report.
      - LOG_LEVEL=info
      # Authentication defaults to local accounts stored by this app. The first
      # visit lands on /setup to create the admin account; that page closes for
      # good once an account exists, so create it before exposing the port.
      # For single sign-on instead, set AUTH_MODE=oidc plus OIDC_ISSUER_URL /
      # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET. Any OpenID Connect provider works
      # — Authentik, Authelia, Keycloak, Pocket ID … (README → Authentication).
    volumes:
      - pick-a-recipe:/app/data
      - pick-a-recipe:/tmp

volumes:
  pick-a-recipe:
