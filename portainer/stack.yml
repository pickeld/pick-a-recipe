# =============================================================================
# Pick-a-Recipe — Portainer Stack (srv2 production)
# =============================================================================
# Deploy via: scripts/portainer-deploy.sh
#
# Uses pickeld/pick-a-recipe:latest from Docker Hub.
# Data volume `social_recipe_social-recipes` is the legacy name kept for srv2 upgrades.
# =============================================================================

services:
  pick-a-recipe:
    image: pickeld/pick-a-recipe:latest
    container_name: pick-a-recipe
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      HOST: 0.0.0.0
      PORT: 5006
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      AUTH_MODE: ${AUTH_MODE:-authentik}
      AUTHENTIK_ISSUER_URL: ${AUTHENTIK_ISSUER_URL:-https://auth.pickel.me/application/o/pick-a-recipe}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_USER_GROUP: ${AUTHENTIK_USER_GROUP:-pick-a-recipe-users}
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-admins}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - pick-a-recipe-data:/app/data
      - pick-a-recipe-data:/tmp

volumes:
  pick-a-recipe-data:
    external: true
    name: social_recipe_social-recipes
